# Déploiement statique — aucun build nécessaire
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/offre"
  to = "/offre.html"
  status = 200
